<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ed"><title>橙宝的学习乐园</title><style>
:root{--ink:#49372f;--muted:#796359;--cream:#fff8ed;--orange:#d85e2c;--shadow:#ddbaa1;--pink:#fce8e3;--yellow:#fff0c3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1060px;margin:auto;padding:32px 28px 60px}header{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}.brand{display:grid;place-items:center;background:#f9c266;border-radius:50%;width:40px;height:40px;color:#874319;font-size:22px}.hero{padding:65px 0 40px;display:flex;justify-content:space-between;align-items:end;gap:24px}.tag{display:inline-block;background:#fce6ce;color:#91421f;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700}h1{font-size:clamp(36px,6vw,60px);line-height:1.15;letter-spacing:-.04em;margin:20px 0 12px}h1 span{color:var(--orange)}.lead{font-size:18px;line-height:1.8;color:var(--muted);margin:0}.hero-note{font-size:14px;color:#8d6b54;white-space:nowrap;padding-bottom:8px}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 0}h2{font-size:24px;margin:0}.heading p{color:var(--muted);font-size:14px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{display:flex;flex-direction:column;min-height:310px;padding:28px;border-radius:24px;border:1px solid #ecd9c8;text-decoration:none;color:inherit;box-shadow:0 12px 28px -20px var(--shadow);transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 32px -18px var(--shadow)}.card:focus-visible{outline:3px solid #aa4b27;outline-offset:4px}.pinyin{background:var(--pink)}.math{background:var(--yellow)}.visual{display:flex;align-items:center;justify-content:space-between;min-height:110px}.illustration{font-size:70px;line-height:1}.badge{align-self:start;background:#fffaf5;border-radius:999px;padding:8px 12px;font-size:13px;color:#805346;font-weight:700}.card h3{font-size:26px;margin:20px 0 8px}.card p{font-size:15px;line-height:1.7;color:#705a50;margin:0}.go{margin-top:auto;padding-top:24px;color:#97411e;font-weight:800}.footer{margin-top:46px;padding-top:20px;border-top:1px solid #eadccf;color:var(--muted);font-size:13px;line-height:1.7}@media(max-width:650px){main{padding:24px 20px 40px}.hero{padding:48px 0 30px;display:block}.hero-note{margin-top:18px}.grid{grid-template-columns:1fr}.card{min-height:260px}.heading p{display:none}.visual{min-height:75px}.illustration{font-size:56px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><span class="brand" aria-hidden="true">✿</span> 橙宝的学习乐园</header><section class="hero"><div><span class="tag">每天一点点，快乐长大</span><h1>今天想去哪里<span>玩呀？</span></h1><p class="lead">选一个喜欢的小天地，<br>一起发现学习的乐趣。</p></div><div class="hero-note">给好奇心留一扇小小的门 ✦</div></section><section aria-labelledby="explore"><div class="heading"><h2 id="explore">出发去探索</h2><p>挑一个喜欢的，开始吧</p></div><div class="grid"><a class="card pinyin" href="https://jiangren.github.io/bunny-pinyin-garden/"><div class="visual"><span class="badge">认识拼音</span><span class="illustration" aria-hidden="true">🐰</span></div><h3>小兔拼音花园</h3><p>听一听、认一认，和小兔一起认识拼音。</p><span class="go">进入花园 →</span></a><a class="card math" href="https://jiangren.github.io/sweet-math/"><div class="visual"><span class="badge">趣味数学</span><span class="illustration" aria-hidden="true">🍭</span></div><h3>甜甜数学乐园</h3><p>数一数、算一算，在甜蜜的游戏里练习数学。</p><span class="go">开始挑战 →</span></a></div></section><footer class="footer">给家长：学习进度目前保存在使用的浏览器中。甜甜数学可在设置中导出和导入进度。</footer></main></body></html>
